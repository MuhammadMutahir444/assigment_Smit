<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="parent">

        <div class="part1">

            <img class="logo" src="./llogo 1.png" alt="Saylani Logo">

            <h2>Log into your Account</h2>

           
            <div class="input-box">
                <span><img src="./Vector.png" alt=""></span>
                <input type="email" placeholder="iamchis_wallace@email.com">
            </div>

            <div class="input-box">
                <span><img src="./Vector2.png" alt=""></span>
                <input type="password" placeholder="Password">
                <span><img src="./Show.png" alt=""></span>
            </div>

            <p class="forgot">Forgot Password?</p>

            <div class="line"></div>

            <button class="signin">Sign in</button>

            <div class="or">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

<button class="social">
    <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.9 6.1-15Z"/>
        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/>
        <path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/>
        <path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3c1.6-4.8 6.1-8.3 11.4-8.3Z"/>
    </svg>
    Sign in with Google
</button>


            
<button class="social">
    <svg class="facebook-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#4267B2">
        <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.093 10.125 24v-8.438H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.49 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.093 24 18.1 24 12.073Z"/>
    </svg>
    Sign in with Facebook
</button>
            
<button class="social">
    <svg class="apple-icon" viewBox="0 0 24 24" aria-hidden="true" fill="white">
        <path d="M17.05 12.54c-.02-2.01 1.64-2.98 1.72-3.03-.94-1.37-2.4-1.56-2.92-1.58-1.24-.13-2.43.73-3.06.73-.64 0-1.61-.71-2.65-.69-1.36.02-2.63.8-3.33 2.03-1.42 2.46-.36 6.08 1.02 8.07.68.97 1.48 2.06 2.53 2.02 1.02-.04 1.4-.65 2.63-.65 1.22 0 1.57.65 2.65.63 1.1-.02 1.79-.99 2.46-1.97.79-1.12 1.11-2.22 1.13-2.28-.03-.01-2.16-.83-2.18-3.28ZM15.04 6.6c.55-.67.92-1.59.82-2.51-.79.03-1.76.53-2.33 1.2-.51.59-.96 1.53-.84 2.43.89.07 1.8-.45 2.35-1.12Z"/>
    </svg>
    Sign in with Apple
</button>


            <p class="create">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </div>

        <!-- Right Side -->
        <div class="part2">
            <img src="./pic.jpg" alt="Student studying">
        </div>

    </main>

</body>
</html>
